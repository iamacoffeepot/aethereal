[workspace]
resolver = "3"
members = [
    "crates/aethereal-actor",
    "crates/aethereal-chassis-browser",
    "crates/aethereal-chassis-desktop",
    "crates/aethereal-chassis-headless",
    "crates/aethereal-data",
    "crates/aethereal-data-derive",
    "crates/aethereal-files",
    "crates/aethereal-http",
    "crates/aethereal-math",
    "crates/aethereal-render",
    "crates/aethereal-substrate",
    "crates/aethereal-tcp",
    "crates/aethereal-window",
    "xtask",
]
# Every member but `xtask`, the workspace's commands, which a plain `cargo build` or `cargo test` never compiles: it is
# run as `cargo xtask`, and linted and tested with the rest by `--workspace`.
default-members = [
    "crates/aethereal-actor",
    "crates/aethereal-chassis-browser",
    "crates/aethereal-chassis-desktop",
    "crates/aethereal-chassis-headless",
    "crates/aethereal-data",
    "crates/aethereal-data-derive",
    "crates/aethereal-files",
    "crates/aethereal-http",
    "crates/aethereal-math",
    "crates/aethereal-render",
    "crates/aethereal-substrate",
    "crates/aethereal-tcp",
    "crates/aethereal-window",
]
# The guest the headless chassis's tests run: built for wasm32 apart from the workspace by the chassis's build script,
# and a path dependency of its tests, for its types.
exclude = ["crates/aethereal-chassis-headless/guests/echo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
blake3 = { version = "1.8", default-features = false }
crossbeam-queue = "0.3"
libm = { version = "0.2", default-features = false }
pollster = "1.0.1"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[profile.dev]
debug = "line-tables-only"

# The engine's turn runs through several crates, and is only as fast as what is inlined across them.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
# A path the compiler can shorten is written short.
unused_qualifications = "warn"

[workspace.lints.rustdoc]
redundant_explicit_links = "warn"
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
# Every level here is a merge gate: CI runs clippy with `-D warnings`, so a
# `warn` fails a pull request as a `deny` does.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
# `crate::a::b::Thing` written inline where a `use` would shorten it.
absolute_paths = "warn"
undocumented_unsafe_blocks = "deny"
cloned_instead_of_copied = "deny"
large_stack_arrays = "deny"
match_wildcard_for_single_variants = "deny"
uninlined_format_args = "deny"
unreadable_literal = "deny"
# A module with child modules is `foo/mod.rs`; `foo.rs` is a leaf.
self_named_module_files = "deny"

# Off: each fights an idiom this workspace uses on purpose.
float_cmp = "allow"
# A program's bootstrap is a future the host awaits on its own thread (ADR-0029): it is never sent, and holds the
# host's setup, which need not be `Send`.
future_not_send = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
needless_pass_by_ref_mut = "allow"
too_long_first_doc_paragraph = "allow"
