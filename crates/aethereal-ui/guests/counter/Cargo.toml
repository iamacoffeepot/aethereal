[package]
name = "aethereal-guest-counter"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "A screen of the widget library that runs as a guest: a count and a button that adds one to it (ADR-0056, ADR-0054)"

# Built for wasm32 by hand into the module the `guest_counter` example's `Code` holds:
# `cargo build --release --target wasm32-unknown-unknown -p aethereal-guest-counter`. The example names it as a
# dependency, which makes it one of the workspace's members, built with the workspace's lock and profiles.

[lib]
# A cdylib for the module, and an rlib so the example can name its type to spawn it from its kind's head.
crate-type = ["cdylib", "rlib"]

[dependencies]
aethereal-actor = { path = "../../../aethereal-actor", features = ["guest"] }
aethereal-data = { path = "../../../aethereal-data" }
aethereal-render = { path = "../../../aethereal-render" }
aethereal-ui = { path = "../.." }

[lints]
workspace = true
