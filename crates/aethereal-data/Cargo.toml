[package]
name = "aethereal-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Plain data: the byte layout, the schema vocabulary, and the codec every other piece is expressed in"

[features]
# `HashMap` and `HashSet` as plain data (ADR-0004). The crate is `no_std` + `alloc` without it.
std = []
# Plain data as JSON text, from a schema and bytes (ADR-0007).
json = []
# Built for a guest: each kind writes its id into its module's `aethereal.kinds` section (ADR-0054). Turned on by
# `aethereal-actor/guest`, and inert for any target but WebAssembly.
guest = []

[dependencies]
aethereal-data-derive = { path = "../aethereal-data-derive" }

[lints]
workspace = true
