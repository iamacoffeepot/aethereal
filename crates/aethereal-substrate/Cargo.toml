[package]
name = "aethereal-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The substrate, the engine's core: the views folded from the effects of finished turns, and the table of actors as the first"

[features]
# The outside seat, and the harness a test speaks through it with (ADR-0036).
harness = ["dep:pollster"]

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data", features = ["json"] }
aethereal-data-derive = { path = "../aethereal-data-derive" }
crossbeam-queue = { workspace = true }
# A desk blocks on its program's bootstrap, as the native hosts do (ADR-0029, ADR-0036).
pollster = { workspace = true, optional = true }
# A map under the numbers the engine counts out itself, with a hash that is the same on every run.
rustc-hash = { workspace = true }

[dev-dependencies]
# An integration test reads actors' state through the engine, which only this feature opens (ADR-0036).
aethereal-substrate = { path = ".", features = ["harness"] }

[lints]
workspace = true
