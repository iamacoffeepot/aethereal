[package]
name = "aethereal-substrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The substrate, the engine's core: the views folded from the effects of finished turns, and the table of actors as the first"

[features]
# The outside seat, and the harness a test speaks through it with (ADR-0036).
harness = []

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data", features = ["json"] }
aethereal-data-derive = { path = "../aethereal-data-derive" }
crossbeam-queue = { workspace = true }

[dev-dependencies]
# The tests' hosts block on a program's bootstrap, as the native hosts do (ADR-0029).
pollster = { workspace = true }

[lints]
workspace = true
