[package]
name = "aethereal-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The store: a root that keeps binaries checked in from a path, by the BLAKE3 hash of their bytes, under names that move, within a byte budget (ADR-0039)"

[features]
# The hub's tools for the agent (ADR-0039): types only, as a program lists what it serves and nothing is spawned for it.
tools = ["dep:aethereal-tools"]

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data" }
aethereal-tools = { path = "../aethereal-tools", optional = true }

[lints]
workspace = true
