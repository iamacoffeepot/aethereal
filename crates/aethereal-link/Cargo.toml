[package]
name = "aethereal-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The link to engines: an engine's tools handed to its hub over TCP, the hub's actor for each engine, and the engines it spawns (ADR-0038, ADR-0040)"

[features]
# The hub's tools for the agent (ADR-0038): types only, as a program lists what it serves and nothing is spawned for it.
tools = ["aethereal-data/json"]

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data" }
aethereal-process = { path = "../aethereal-process" }
aethereal-store = { path = "../aethereal-store" }
aethereal-substrate = { path = "../aethereal-substrate" }
aethereal-tcp = { path = "../aethereal-tcp" }
aethereal-tools = { path = "../aethereal-tools" }

[lints]
workspace = true
