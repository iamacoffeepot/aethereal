[package]
name = "aethereal-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The sessions capability: Claude sessions the hub runs in containers, and the client of Docker's Engine API over its Unix socket that makes them (ADR-0057)"

[features]
# The hub's tools for its caller (ADR-0057): types only, as a program lists what it serves and nothing is spawned for it.
tools = []

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
# Docker's requests and replies are JSON, written and read with the workspace's own JSON (ADR-0007).
aethereal-data = { path = "../aethereal-data", features = ["json"] }
# The sessions' records and transcripts are kept in `Files`' `Save` namespace, asked as any actor asks it.
aethereal-files = { path = "../aethereal-files" }
# The client of Docker's Engine API, and the actor layer the sessions' port's stack asks of each request's bearer.
aethereal-http = { path = "../aethereal-http" }
# Each session's drop box, the one directory of the machine its container is given, is the store's.
aethereal-store = { path = "../aethereal-store" }
aethereal-substrate = { path = "../aethereal-substrate" }
aethereal-tcp = { path = "../aethereal-tcp" }
# Who calls the hub's tools: a session's route names it as the caller (ADR-0057).
aethereal-tools = { path = "../aethereal-tools" }

[lints]
workspace = true
