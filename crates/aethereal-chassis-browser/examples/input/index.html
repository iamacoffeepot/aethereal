<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aethereal: input</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 400px; height: 300px; background: #234; }
  label { display: block; margin: 8px; }
  #said { margin: 8px; white-space: pre; }
</style>
</head>
<body>
<!-- Shown at 400 by 300 CSS pixels over a backing store of twice that, so the pointer's place in the canvas's pixels
     is twice its place on the page. -->
<canvas id="canvas" width="800" height="600"></canvas>
<label>speed <input type="range" id="speed" data-control min="0" max="1" step="0.05" value="0.25"></label>
<div id="said"></div>
<script type="module">
  import init, { start } from "./pkg/input.js";

  const said = document.getElementById("said");
  try {
    await init();
    const program = start(document.getElementById("canvas"));
    const frame = (timestamp) => {
      program.frame(timestamp);
      for (const line of program.said()) {
        said.textContent += `${line}\n`;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  } catch (error) {
    said.textContent = `${error}`;
    throw error;
  }
</script>
</body>
</html>
