<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aethereal: jobs</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #said { position: fixed; top: 8px; left: 8px; white-space: pre; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="said"></div>
<script type="module">
  import init, { start } from "./pkg/jobs.js";

  const canvas = document.getElementById("canvas");
  const scale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(canvas.clientWidth * scale);
  canvas.height = Math.floor(canvas.clientHeight * scale);

  try {
    await init();
    const program = await start(canvas);
    const said = document.getElementById("said");
    const frame = (timestamp) => {
      program.frame(timestamp);
      for (const line of program.said()) {
        said.textContent += `${line}\n`;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  } catch (error) {
    document.getElementById("said").textContent = `${error}`;
    throw error;
  }
</script>
</body>
</html>
