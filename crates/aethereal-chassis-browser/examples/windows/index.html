<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aethereal: windows</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  /* Each canvas fills a box the page can resize by its corner, so one canvas is resized and the other is not. */
  .window { resize: both; overflow: hidden; width: 480px; height: 360px; border: 1px solid #444; }
  .window canvas { display: block; width: 100%; height: 100%; }
  #said { padding: 0 16px; white-space: pre; }
</style>
</head>
<body>
<main>
  <div class="window" id="first-window"><canvas id="first"></canvas></div>
  <div class="window" id="second-window"><canvas id="second"></canvas></div>
</main>
<div id="said"></div>
<script type="module">
  import init, { start } from "./pkg/windows.js";

  const scale = window.devicePixelRatio || 1;
  const canvases = [document.getElementById("first"), document.getElementById("second")];
  for (const canvas of canvases) {
    canvas.width = Math.floor(canvas.clientWidth * scale);
    canvas.height = Math.floor(canvas.clientHeight * scale);
  }

  try {
    await init();
    const program = await start();
    const said = document.getElementById("said");
    const frame = (timestamp) => {
      program.frame(timestamp);
      for (const line of program.said()) {
        said.textContent += `${line}\n`;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  } catch (error) {
    document.getElementById("said").textContent = `${error}`;
    throw error;
  }
</script>
</body>
</html>
