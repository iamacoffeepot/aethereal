<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aethereal: pong</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #8a93a8; font: 14px system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 100%; }
  canvas { display: block; width: min(94vw, calc((100vh - 72px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000; }
  #hint { letter-spacing: 0.06em; }
  #said { display: none; max-width: 36em; padding: 18px 22px; border: 1px solid #2a3142; border-radius: 6px; color: #d6dae3; line-height: 1.5; text-align: center; }
  #said strong { display: block; margin-bottom: 6px; color: #fff; font-size: 16px; }
  body.unable canvas, body.unable #hint { display: none; }
  body.unable #said { display: block; }
</style>
</head>
<body>
<main>
  <!-- The canvas is shown at four by three, its backing store set to the pixels it is shown at. -->
  <canvas id="canvas"></canvas>
  <div id="hint">↑ / ↓ to move · hit while moving to curve · first to 11</div>
  <div id="said"></div>
</main>
<script type="module">
  import init, { start } from "./pkg/pong.js";

  const said = document.getElementById("said");
  const unable = (headline, detail) => {
    said.innerHTML = "";
    const strong = document.createElement("strong");
    strong.textContent = headline;
    said.append(strong, detail);
    document.body.classList.add("unable");
  };

  if (!navigator.gpu) {
    unable("WebGPU is not available", "This game draws with WebGPU, which this browser does not offer. Try a recent Chrome or Edge, or Firefox or Safari with WebGPU turned on.");
  } else {
    const canvas = document.getElementById("canvas");
    const scale = window.devicePixelRatio || 1;
    canvas.width = Math.floor(canvas.clientWidth * scale);
    canvas.height = Math.floor(canvas.clientHeight * scale);

    try {
      await init();
      const program = await start(canvas);
      const frame = () => {
        program.frame();
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    } catch (error) {
      unable("The game could not start", `${error}`);
      throw error;
    }
  }
</script>
</body>
</html>
