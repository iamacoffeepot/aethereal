<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aethereal: {{name}}</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  #said { white-space: pre; }
{{layout.css}}
</style>
</head>
<body>
{{layout.html}}
<div id="said"></div>
<script type="module">
  import init, { start } from "./{{name}}.js";

  // Each canvas is drawn at every device pixel of the size the page shows it at.
  const scale = window.devicePixelRatio || 1;
  for (const canvas of document.querySelectorAll("canvas")) {
    canvas.width = Math.floor(canvas.clientWidth * scale);
    canvas.height = Math.floor(canvas.clientHeight * scale);
  }

  // What the program's roots say, shown a line each under or over the canvas.
  const said = document.getElementById("said");
  try {
    await init();
    const program = await start();
    const frame = (timestamp) => {
      program.frame(timestamp);
      for (const line of program.said()) {
        said.textContent += `${line}\n`;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  } catch (error) {
    said.textContent = `${error}`;
    throw error;
  }
</script>
</body>
</html>
