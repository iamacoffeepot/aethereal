[package]
name = "aethereal-chassis-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The browser chassis: the engine on a page's one thread, cycled by its animation frames, drawing through WebGPU"

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data" }
aethereal-render = { path = "../aethereal-render" }
aethereal-substrate = { path = "../aethereal-substrate" }
aethereal-window = { path = "../aethereal-window" }

# The page's own clock, canvas, and GPU. A native build of the workspace compiles the chassis's frame loop alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu"] }
js-sys = "0.3.106"
# The bindings' version is the `wasm-bindgen` tool's that writes the page's glue.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "AddEventListenerOptions",
    "DomRect",
    "Document",
    "DomRectReadOnly",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "NodeList",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverSize",
    "WheelEvent",
    "Window",
] }

[[example]]
name = "make"
path = "examples/make/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "draw"
path = "examples/draw/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "read"
path = "examples/read/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "input"
path = "examples/input/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "frames"
path = "examples/frames/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "texture"
path = "examples/texture/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "compute"
path = "examples/compute/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "indirect"
path = "examples/indirect/lib.rs"
crate-type = ["cdylib"]

[[example]]
name = "jobs"
path = "examples/jobs/lib.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
