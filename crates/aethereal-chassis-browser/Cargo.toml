[package]
name = "aethereal-chassis-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The browser chassis: the engine on a page's one thread, cycled by its animation frames, drawing through WebGPU"

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-substrate = { path = "../aethereal-substrate" }

# The page's own clock, canvas, and GPU. A native build of the workspace compiles the chassis's frame loop alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser host runs on the page's one thread, so the GPU it hands in is never shared between threads: that is
# what lets it be a resource, which is `Send` (ADR-0010).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl", "fragile-send-sync-non-atomic-wasm"] }
# The bindings' version is the `wasm-bindgen` tool's that writes the page's glue.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"] }

[dev-dependencies]
aethereal-data = { path = "../aethereal-data" }

[[example]]
name = "clear"
path = "examples/clear/lib.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
