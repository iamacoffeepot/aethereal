[package]
name = "aethereal-chassis-headless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The headless chassis: the native host with nothing but the engine, its workers, and its clock"

[features]
# The harness steps this host (ADR-0036).
harness = ["aethereal-substrate/harness"]

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data" }
aethereal-files = { path = "../aethereal-files" }
aethereal-store = { path = "../aethereal-store" }
aethereal-substrate = { path = "../aethereal-substrate" }
aethereal-tcp = { path = "../aethereal-tcp" }
# Hashes each binary the store copies in (ADR-0039).
blake3 = { workspace = true }
# The native host's command line (ADR-0028); nothing else depends on it.
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
core_affinity = "0.8.3"
crossbeam-queue = { workspace = true }
# Blocks on a program's bootstrap, which is a future (ADR-0029).
pollster = { workspace = true }

# The native guest host (ADR-0015); a browser runs guests with its own WebAssembly.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmparser = { version = "=0.246.2", default-features = false }
wasmtime = { version = "=44.0.3", default-features = false, features = ["cranelift", "runtime"] }

# Cores and the poller on Linux (epoll); the poller on macOS (kqueue).
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2.190"

[dev-dependencies]
# The guest the tests run, for its types: its blob is built for wasm32 by the build script.
aethereal-guest-echo = { path = "guests/echo" }
aethereal-chassis-headless = { path = ".", features = ["harness"] }
aethereal-files = { path = "../aethereal-files", features = ["tools"] }
aethereal-http = { path = "../aethereal-http" }
aethereal-link = { path = "../aethereal-link", features = ["tools"] }
aethereal-mcp = { path = "../aethereal-mcp" }
aethereal-tools = { path = "../aethereal-tools" }

[lints]
workspace = true
