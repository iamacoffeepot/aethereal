[package]
name = "aethereal-chassis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The desktop chassis: the native host with windows, on winit, drawing through the GPU it opens on them"

# A native-only host crate (ADR-0001): its window, its GPU, and the waits on them are a native host's. A build for
# wasm32 compiles it empty.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-chassis-headless = { path = "../aethereal-chassis-headless" }
aethereal-data = { path = "../aethereal-data" }
aethereal-files = { path = "../aethereal-files" }
aethereal-link = { path = "../aethereal-link" }
aethereal-pace = { path = "../aethereal-pace" }
aethereal-process = { path = "../aethereal-process" }
aethereal-render = { path = "../aethereal-render" }
aethereal-store = { path = "../aethereal-store" }
aethereal-substrate = { path = "../aethereal-substrate" }
aethereal-tcp = { path = "../aethereal-tcp" }
aethereal-window = { path = "../aethereal-window" }
pollster = { workspace = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "metal", "vulkan"] }
winit = "0.30.13"

# The `linked_window` example hands its hub the renderer's `capture_frame` (ADR-0043) and `record_clip`, which holds
# the clock through the pacer (ADR-0045), `send_input`, `set_pace`, and `advance` (ADR-0046), and the window tools
# (ADR-0047).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The `linked_window` example places its lines of text at points and clips one to a box (ADR-0052).
aethereal-math = { path = "../aethereal-math" }
aethereal-pace = { path = "../aethereal-pace", features = ["tools"] }
aethereal-render = { path = "../aethereal-render", features = ["tools"] }
aethereal-tools = { path = "../aethereal-tools" }
aethereal-window = { path = "../aethereal-window", features = ["tools"] }

[lints]
workspace = true
