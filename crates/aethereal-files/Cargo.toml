[package]
name = "aethereal-files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The file capability: a root that reads files for every other actor, in named namespaces, by a job only it makes (ADR-0032)"

[features]
# The tools of this capability (ADR-0037): types only, as a program lists what it serves and nothing is spawned for it.
# It brings in no HTTP (ADR-0038).
tools = ["dep:aethereal-tools"]

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data" }
aethereal-tools = { path = "../aethereal-tools", optional = true }

[lints]
workspace = true
