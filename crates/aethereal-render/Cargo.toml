[package]
name = "aethereal-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The renderer: the root that owns the GPU, and makes what is drawn for the actors that ask (ADR-0021)"

[features]
# The tools of this capability (ADR-0037, ADR-0043): types only, as a program lists what it serves and nothing is
# spawned for it. `capture_frame` writes PNGs; `record_clip` also holds the clock and writes them as files (ADR-0045).
tools = ["dep:aethereal-tools", "dep:png", "dep:aethereal-pace", "dep:aethereal-files"]

# Writes PNGs of glyphs' distance fields, and of text drawn from them, for eyes to judge (ADR-0052).
[[example]]
name = "font_msdf"
required-features = ["tools"]

[dependencies]
aethereal-actor = { path = "../aethereal-actor" }
aethereal-data = { path = "../aethereal-data" }
aethereal-files = { path = "../aethereal-files", optional = true }
# The font module's outlines are in its vectors and boxes (ADR-0052).
aethereal-math = { path = "../aethereal-math" }
aethereal-pace = { path = "../aethereal-pace", optional = true }
aethereal-tools = { path = "../aethereal-tools", optional = true }
aethereal-window = { path = "../aethereal-window" }
png = { version = "=0.18.1", optional = true }
crossbeam-queue = { workspace = true }
# The types the shader package's generated code is written in (ADR-0030): two structs of static strings.
wesl-core = "=0.1.0"
naga = { version = "30.0.1", features = ["wgsl-in"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }

# A browser's GPU is WebGPU, used on the page's one thread, so what it makes is never shared between threads: that is
# what lets the GPU be a resource, which is `Send` (ADR-0010).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }

# The build script packages the shared shader pieces in `shaders/` for dependents' build scripts (ADR-0030). It is
# before its first stable release, so a newer version is taken on purpose, with the pieces' validation test as its gate.
[build-dependencies]
wesl = { version = "=0.6.0", features = ["package"] }

# The renderer's tests make what it makes on a device that draws nothing, as no machine they run on need have a GPU.
# The shader pieces' test links each module of the package as a dependent's build script does. The scan's and the
# compaction's test runs them on whatever adapter the machine has, by the desktop chassis's backends, and the segment's
# runs the WGSL `Segment` on a Vulkan adapter and compares it with `aethereal-math`'s on the table of cases both follow;
# each skips without an adapter.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["noop", "dx12", "metal", "vulkan"] }
wesl = "=0.6.0"
aethereal-math = { path = "../aethereal-math", features = ["cases"] }
pollster = { workspace = true }

[lints]
workspace = true
