name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run judging the old head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The compiling jobs of a pull request run on a RunsOn spot runner, with
      # `extras=s3-cache` sending the cache API to the stack's bucket. That
      # runner is paid for, so it serves only a pull request the repository
      # owner pushed from a branch of this repository. A fork's pull request,
      # anyone else's push, and post-merge runs on `main` (which nobody waits
      # on) use a GitHub-hosted runner.
      - id: runner
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          label=ubuntu-latest
          if [[ "$EVENT" == pull_request && "$ACTOR" == "$OWNER" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            label="runs-on=${GITHUB_RUN_ID}/runner=8cpu-linux-x64/extras=s3-cache"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

  # Each job runs its part of `cargo xtask check` (`xtask/src/check.rs`), the one list of what CI runs, which a bare
  # `cargo xtask check` runs locally in full.
  #
  # The toolchain comes from `rust-toolchain.toml`, never from a channel named
  # here: `rustup toolchain install` with no argument reads the file, with its
  # components and targets, so CI and a local run use the same compiler.
  fmt:
    name: Format
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo xtask check fmt

  clippy:
    name: Clippy
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2
        if: needs.plan.outputs.runner != 'ubuntu-latest'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # OpenH264 builds its assembly only where `nasm` is found (ADR-0045); the cache is keyed apart from the builds
      # made without it, as its build script does not run again when `nasm` appears.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: nasm
      - run: cargo xtask check clippy

  test:
    name: Test
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2
        if: needs.plan.outputs.runner != 'ubuntu-latest'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # As in Clippy: OpenH264 with its assembly, in a cache of its own.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: nasm
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.146
      # nextest, then the doctests, which it does not run; nextest reads its profile from `NEXTEST_PROFILE`.
      - run: cargo xtask check test
        env:
          NEXTEST_PROFILE: ci

  # ADR-0001: every piece builds for a browser host. In a browser the host
  # itself is wasm32, so the whole workspace is checked and linted for that
  # target, not only the guest crates.
  browser-host:
    name: Browser host
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2
        if: needs.plan.outputs.runner != 'ubuntu-latest'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: wasm32
      - run: cargo xtask check browser

  # The one verdict to wait on.
  ci-pass:
    name: CI pass
    if: always()
    needs: [plan, fmt, clippy, test, browser-host]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
