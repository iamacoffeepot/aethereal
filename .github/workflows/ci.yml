name: CI

# A change to documents alone compiles nothing, so it runs no CI. No check is
# required to merge, so a pull request that skips CI is not held waiting.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

# A newer push to the same pull request supersedes the run judging the old head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The compiling jobs of a pull request run on a RunsOn spot runner, with
      # `extras=s3-cache` sending the cache API to the stack's bucket. That
      # runner is paid for, so it serves only a pull request the repository
      # owner pushed from a branch of this repository. A fork's pull request,
      # anyone else's push, and post-merge runs on `main` (which nobody waits
      # on) use a GitHub-hosted runner.
      - id: runner
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          label=ubuntu-latest
          if [[ "$EVENT" == pull_request && "$ACTOR" == "$OWNER" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            label="runs-on=${GITHUB_RUN_ID}/runner=8cpu-linux-x64/extras=s3-cache"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

  # Each job runs its part of `cargo xtask check` (`xtask/src/check.rs`), the one list of what CI runs, which a bare
  # `cargo xtask check` runs locally in full.
  #
  # The toolchain comes from `rust-toolchain.toml`, never from a channel named
  # here: `rustup toolchain install` with no argument reads the file, with its
  # components and targets, so CI and a local run use the same compiler.
  fmt:
    name: Format
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo xtask check fmt

  clippy:
    name: Clippy
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2
        if: needs.plan.outputs.runner != 'ubuntu-latest'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # OpenH264 builds its assembly only where `nasm` is found (ADR-0045); the cache is keyed apart from the builds
      # made without it, as its build script does not run again when `nasm` appears.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: nasm
      - run: cargo xtask check clippy

  # A pull request runs the tests of the packages its change can fail, which `cargo xtask affected` selects
  # (`xtask/src/affected/`): the packages its changed paths sit in, and every package building on one of them; and,
  # where it changes a manifest or the lockfile, every member whose build the change to the package graph reaches,
  # found by comparing the graph at `HEAD^1`, loaded from a temporary worktree of it, with the graph at the head. The
  # selection is conservative: a path that shapes every build or test (the toolchain, `.cargo/`, `.config/`,
  # `clippy.toml`, this file, and xtask's files that select or run the suite) runs everything, as do a root manifest
  # section other than its dependency and member lists, a base graph that cannot be loaded, and a path no package and
  # no rule claims. Only the tests narrow: Clippy and Browser host compile every package on every pull request.
  #
  # A push to `main` runs every test, whatever changed. `main` squash-merges, so it tests the exact tree that landed,
  # and a package a selection missed fails there: a miss delays a red signal to the merge, never loses it.
  test:
    name: Test
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2
        if: needs.plan.outputs.runner != 'ubuntu-latest'
      # A pull request's checkout is its merge commit; its first parent, the tip of the branch it merges into, is what
      # the selection diffs against, so the checkout holds one commit more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - run: rustup toolchain install
      # As in Clippy: OpenH264 with its assembly, in a cache of its own.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: nasm
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.146
      # Its log names the selection, and why: `selected tests=none` is a change that reaches no package, whose tests
      # the next step then skips.
      - name: Select affected packages (pull request only)
        id: affected
        if: github.event_name == 'pull_request'
        run: cargo xtask affected --base HEAD^1 --github-output
      # nextest, then the doctests, which it does not run; nextest reads its profile from `NEXTEST_PROFILE`. A narrowed
      # selection always holds xtask, whose suite holds the invariants that keep the selection sound: they scan every
      # package for what the graph cannot see, so a change to any package can break one. `package_args` holds only
      # `-p` and package names from the workspace's own list, so its expansion is shell-safe; it is empty when every
      # test runs, and on a push, where the selection step does not run.
      - name: Test
        if: github.event_name != 'pull_request' || steps.affected.outputs.run_all == 'true' || steps.affected.outputs.package_args != ''
        run: cargo xtask check test ${{ steps.affected.outputs.package_args }}
        env:
          NEXTEST_PROFILE: ci

  # ADR-0001: every piece builds for a browser host. In a browser the host
  # itself is wasm32, so the whole workspace is checked and linted for that
  # target, not only the guest crates.
  browser-host:
    name: Browser host
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2
        if: needs.plan.outputs.runner != 'ubuntu-latest'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: wasm32
      - run: cargo xtask check browser

  # The one verdict to wait on.
  ci-pass:
    name: CI pass
    if: always()
    needs: [plan, fmt, clippy, test, browser-host]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
