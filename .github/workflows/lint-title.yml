name: Lint title

# Checks that a pull request title is a Conventional Commit. `main`
# squash-merges with the title as the commit subject, so the title is the
# commit. Its own workflow, not a ci.yml job: the `edited` trigger re-checks
# a fixed title without re-running the Rust jobs.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

# A newer title edit or push supersedes the run judging the old one.
concurrency:
  group: lint-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-title:
    name: Lint title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
